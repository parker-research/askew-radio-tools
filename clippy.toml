# Transcendental float functions call the platform libm, whose results differ by
# an ULP or so between OSes/CPUs and make pinned test outputs non-reproducible.
# Use the `libm` crate instead.
disallowed-methods = [
    { path = "f32::sin", reason = "platform-dependent results; use the libm crate" },
    { path = "f32::cos", reason = "platform-dependent results; use the libm crate" },
    { path = "f32::tan", reason = "platform-dependent results; use the libm crate" },
