name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [debug, release]
    env:
      PROFILE_FLAG: ${{ matrix.profile == 'release' && '--release' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'debug'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets ${{ env.PROFILE_FLAG }}

      - name: Clippy
        run: cargo clippy --all-targets ${{ env.PROFILE_FLAG }} -- -D warnings

      - name: Build
        run: cargo build --all-targets ${{ env.PROFILE_FLAG }}

      - name: Test
        run: cargo test --all-targets ${{ env.PROFILE_FLAG }}
