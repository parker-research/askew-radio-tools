[package]
name = "askew-radio-tools"
version = "0.3.0"
edition = "2024"
description = "AX100 satellite packet decoder for SatNOGS audio"
license = "AGPL-3.0-only"
repository = "https://github.com/parker-research/askew-radio-tools"
readme = "README.md"
keywords = ["satellite", "cubesat", "satnogs", "ax100", "dsp"]
categories = ["aerospace", "science", "command-line-utilities"]

[[bin]]
name = "askew_demod_from_file"
path = "src/main.rs"

[dependencies]
# Read audio files.
symphonia = { version = "0.5", features = ["wav", "ogg", "vorbis"] }

# Calculate CRC32 (has platform-specific performance optimizations too).
crc32c = "0.6"

# Error handling.
thiserror = "1"
anyhow = "1"

# CLI argument parsing.
clap = { version = "4.6.1", features = ["derive"] }

# JSONL output.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
rand = "0.8"

# Only used by the real-world-audio integration test, to fetch
# sample SatNOGS observations over HTTPS.
ureq = { version = "2", default-features = false, features = ["tls"] }
