[package]
name = "ax100-radio-csp-decoder"
version = "0.1.0"
edition = "2024"
description = "AX100 satellite beacon decoder for SatNOGS audio"

[dependencies]
# Read audio files.
symphonia = { version = "0.5", features = ["wav", "ogg", "vorbis"] }

# Complex number type.
num-complex = "0.4"

# Digital second order IIR filters, also known as biquads.
biquad = "0.4"

# Addresses memory by bits, for packed collections and bitfields.
bitvec = "1"

# Calculate CRC32 (has platform-specific performance optimizations too).
crc32c = "0.6"

# Error handling.
thiserror = "1"
anyhow = "1"

# CLI argument parsing.
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
rand = "0.8"
